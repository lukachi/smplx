[package]
name = "smplx-sdk"
version = "0.0.9"
description = "Simplex sdk to simplify the development with simplicity"
license.workspace = true
edition.workspace = true
repository = "https://github.com/BlockstreamResearch/smplx"
readme = "../../README.md"

[lints]
workspace = true

[features]
default = ["provider"]
# Networking-backed provider backends: Esplora over HTTP and Elements over
# JSON-RPC. Disabling this feature drops `minreq` and `bitcoincore-rpc`, which
# do not build for `wasm32-unknown-unknown`, and leaves the pure parts of the
# `provider` module — `ProviderTrait`, `ProviderError` and `SimplicityNetwork` —
# in place. A wallet that owns its own networking builds with
# `--no-default-features`.
provider = ["dep:minreq", "dep:bitcoincore-rpc"]

[dependencies]
thiserror = { workspace = true }
sha2 = { workspace = true }
minreq = { workspace = true, optional = true }
simplicityhl = { workspace = true }
bitcoincore-rpc = { workspace = true, optional = true }
serde = { workspace = true }
hex = { workspace = true }

serde_json = { version = "1.0" }
elements-miniscript = { version = "0.4", features = ["base64", "serde"] }
bip39 = { version = "2.0.0", features = ["rand"] }
dyn-clone = { version = "1.0.20" }
bitcoin_hashes = { version = "0.14.1" }
